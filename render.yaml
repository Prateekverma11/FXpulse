databases:
  - name: fxpulse-db
    databaseName: fxpulse
    user: fxpulse
    plan: free

services:
  - type: web
    name: fxpulse
    env: node
    plan: free
    buildCommand: npm run build && npm --prefix server run prisma:push && npm --prefix server run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fxpulse-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CRON_SCHEDULE
        value: "*/15 * * * *"
      - key: FX_API_URL
        value: "https://open.er-api.com/v6"
